<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dc82"/>
      <stop offset="100%" stop-color="#00a651"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- TV Screen (Back Left) -->
  <g class="device-tv" stroke="#00dc82" stroke-width="2.5">
    <!-- Stand -->
    <path d="M190 320 L180 360 L360 360 L350 320" stroke="#00dc82" stroke-width="2" fill="none" opacity="0.6"/>
    <line x1="160" y1="360" x2="380" y2="360" stroke="#00dc82" stroke-width="2.5" opacity="0.8"/>
    <!-- Outer Bezel -->
    <rect x="40" y="40" width="460" height="280" rx="12" fill="#070a0f" stroke="#00dc82" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="40" y="40" width="460" height="280" rx="12" fill="#0a0e17" stroke="#00dc82" stroke-width="2"/>
    <!-- Inner Screen Display -->
    <rect x="52" y="52" width="436" height="256" rx="6" fill="#04070c"/>
    <!-- Centered TK Logo on TV -->
    <g transform="translate(225, 145) scale(0.65)">
      <!-- T shape -->
      <path d="M0 0 L40 0 L40 10 L25 10 L25 50 L15 50 L15 10 L0 10 Z" fill="#ffffff"/>
      <!-- Play button -->
      <polygon points="32,25 32,45 48,35" fill="#00dc82"/>
      <!-- K diagonal wings -->
      <path d="M42 0 L68 0 L45 28 L72 60 L46 60 L28 36 Z" fill="#00dc82"/>
    </g>
  </g>

  <!-- Laptop Screen (Front Middle) -->
  <g class="device-laptop" transform="translate(230, 160)">
    <!-- Screen Lid -->
    <rect x="20" y="20" width="280" height="180" rx="8" fill="#080c14" stroke="#00dc82" stroke-width="2" filter="url(#glow)"/>
    <rect x="20" y="20" width="280" height="180" rx="8" fill="#0b101d" stroke="#00dc82" stroke-width="1.8"/>
    <rect x="28" y="28" width="264" height="164" rx="4" fill="#030509"/>
    <!-- Centered TK Logo on Laptop -->
    <g transform="translate(132, 85) scale(0.48)">
      <path d="M0 0 L40 0 L40 10 L25 10 L25 50 L15 50 L15 10 L0 10 Z" fill="#ffffff"/>
      <polygon points="32,25 32,45 48,35" fill="#00dc82"/>
      <path d="M42 0 L68 0 L45 28 L72 60 L46 60 L28 36 Z" fill="#00dc82"/>
    </g>
    <!-- Base Keyboard Body -->
    <path d="M0 200 L320 200 L300 216 L20 216 Z" fill="#0e1422" stroke="#00dc82" stroke-width="1.8"/>
    <!-- Trackpad notch -->
    <line x1="130" y1="202" x2="190" y2="202" stroke="#00dc82" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Smartphone (Front Right) -->
  <g class="device-phone" transform="translate(480, 175)">
    <!-- Phone Body -->
    <rect x="15" y="15" width="105" height="205" rx="18" fill="#090d16" stroke="#00dc82" stroke-width="2.2" filter="url(#glow)"/>
    <rect x="15" y="15" width="105" height="205" rx="18" fill="#0a0f1b" stroke="#00dc82" stroke-width="1.8"/>
    <rect x="21" y="21" width="93" height="193" rx="14" fill="#03060a"/>
    <!-- Dynamic Island / Speaker notch -->
    <rect x="52" y="26" width="30" height="5" rx="2.5" fill="#00dc82" opacity="0.8"/>
    <!-- Centered TK Logo on Phone -->
    <g transform="translate(54, 98) scale(0.38)">
      <path d="M0 0 L40 0 L40 10 L25 10 L25 50 L15 50 L15 10 L0 10 Z" fill="#ffffff"/>
      <polygon points="32,25 32,45 48,35" fill="#00dc82"/>
      <path d="M42 0 L68 0 L45 28 L72 60 L46 60 L28 36 Z" fill="#00dc82"/>
    </g>
    <!-- Home indicator line -->
    <line x1="45" y1="205" x2="90" y2="205" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
